# CI workflow for flutter-gradle-tool
---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code || { echo "go.mod/go.sum not tidy"; exit 1; }

      - name: Vet
        run: go vet ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: Test — ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: go build -ldflags "-X main.version=ci-${{ github.sha }}" -o fgt${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/fgt/...